[package]
name = "thejar"
version = "0.1.0"
edition = "2024"
description = "The Jar installs and updates the CookieJarTools desktop apps."
authors = ["Joseph Cook"]
license-file = "LICENSE.md"
repository = "https://github.com/CookieJarTools/TheJar"
publish = false

[[bin]]
name = "thejar"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "links", "clipboard"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
egui_commonmark = { version = "0.26", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
dirs = "7"
open = "5"

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["native-tls", "gzip"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
